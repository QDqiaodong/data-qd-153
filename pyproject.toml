[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "data-qd-153"
version = "0.1.0"
description = "Exact independent basic-event fault-tree probability enumeration"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
fault-tree = "fault_tree.cli:main"
fault-history = "fault_tree.history.cli:main"
fault-diagnose = "fault_tree.diagnose.cli:main"
fault-factor = "fault_tree.factor.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
